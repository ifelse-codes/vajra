version: 3

maturity: L2

session:
  max_assumptions: 2
  max_retries: 2
  max_files_per_atomic_change: 3
  max_stories_per_session: 1
  cap_hours_per_session: 2
  ground_truth_every_n_sessions: 5
  one_session_per_chat: true   # new vajra-session = new chat (AGENTS.md step 10). Agent-followed today; Vajra-enforced is roadmapped.

branch:
  forbid_direct_work_on: [main, master]
  required_session_branch_pattern: '^session-\d{2,}-[a-z0-9-]+$'
  ground_truth_commit_exempt_branch_suffixes: [-closeout, -enforcement]

commit:
  autonomous: false
  require_user_approval: true
  approval_tokens: [approved, lgtm, "ship it", "yes commit", "go ahead and commit", "go ahead"]
  forbid_skip_hooks: true
  forbid_force_push_to: [main, master]

verify:
  required_for_done: true
  script_pattern: 'scripts/verify-session-{NN}.sh'
  template: 'scripts/verify-session-template.sh'
  artifacts_dir: '.ai/verify/session-{NN}/'
  exit_zero_required: true
  closeout_script: 'scripts/verify-closeout.sh'
  closeout_must_pass_before_close: true
  # The bound (S73): the QA gate re-runs this script LIVE at close; a run past timeout_secs is
  # killed and BLOCKS (cannot-evaluate → FAIL), never a silent pass, never a hang. Generous on
  # purpose — kills hangs, not slow truth. Missing key → gate_run::DEFAULT_TIMEOUT_SECS (600).
  timeout_secs: 600

demo:
  script_pattern: 'scripts/demo-session-{NN}.sh'
  template: 'scripts/demo-session-template.sh'
  cumulative: true
  # The sprint-demo contract (S71): the demo must SHOW each element (a `demo:<element>` marker
  # in its live output) — the Demo-er gate re-runs the script at close and blocks otherwise.
  required_elements: [header, cases, summary_table, before_after]
  # Same bound (S73) on the Demo-er live re-run — killed past timeout_secs → cannot-evaluate BLOCK.
  timeout_secs: 600
  presentation: interactive_html
  presentation_rules:
    - run demo script or commands to capture real output
    - present as interactive HTML slide deck via show_widget
    - terminal-styled output blocks with PASS/FAIL coloring
    - one slide per major feature, final slide is scorecard
    - include auto-play and keyboard nav
    - bash script stays for CI/verify — presentation is agent's job for user

release:
  # The ship contract (S72): the Releaser gate re-derives these facts from git LIVE at close —
  # prior session's branch merged into main (ancestry) · local main synced with the last-fetched
  # origin/main · merged session-* locals pruned (the S37 return-to-main step, enforced). Never
  # a recorded claim; the gate surfaces + enforces and never pushes, merges, or deletes.
  require_merged_prior: true
  require_main_synced: true
  require_pruned: true

state:
  state_md_mode: snapshot
  knowledge_md_mode: append-permanent-only
  session_summary_in: sessions/session-{NN}-summary.md
  ground_truth_summary_in: sessions/session-{NN}-ground-truth.md
  session_prompt_in: prompts/{NN}-task-{slug}.md
  closeout_active_branch_value: "None — between sessions (SNN complete, SNN+1 not yet started)."

communication:
  max_words_per_response: 200
  required_formats: [bullets, tables, code-blocks]
  forbid: [greetings, apologies, filler, narration-of-thinking, trailing-summaries]
  max_bullets_per_section: 5

self_review_questions: [what_can_break, hidden_assumptions, production_ready, defensive_patches_only_on_repro_evidence, scope_intact]

end_of_session:
  must_present_n_options: 3
  options_drawn_from: .ai/ROADMAP.md
  options_format: [title, one_sentence_goal, why_pick_this, key_risk]
  must_write_next_prompt_before_close: true

ground_truth:
  forbid_code_changes: true
  forbid_commits: true
  forbid_prs: true
  required_outputs: [sessions/session-{NN}-ground-truth.md]
  # Every GT must catch BOTH direction drift (vision+roadmap) and discipline drift (rules+constitution+state).
  # Rules exist to serve the vision — auditing rule-following without auditing the vision is the trap S20 caught.
  drift_axes: [vision, roadmap, rules, constitution, state, cost, usage]
  required_audits: [vision_alignment, roadmap_alignment, state_drift, knowledge_staleness, constraint_violation_review, constitution_review, cost_review, dogfood_check, pipeline_advance_check, dogfood_staleness]
  # dogfood_check added S30: 7 audits passed green while the product sat un-dogfooded (~$0 spend since S07).
  # No audit measured USAGE — the S25 false-green finding one level deeper. The cost ledger is the evidence.
  # pipeline_advance_check added S74: no audit measured whether the PIPELINE advances (the S25/S60/S65/S70
  # meta-gap). The payload counter is the evidence — `vajra next --stations NN`, a DERIVED K-of-8 (never a
  # self-asserted digit), read live at GT time; no new store.
  # dogfood_staleness added S91: STATE.md's dogfood date drifted wrong for 3 GTs because it was
  # hand-maintained. The live query `vajra next --dogfood-age` derives session + date from git
  # (never from STATE.md). Run it at GT time; compare against the last dogfood_check verdict.
  dogfood_questions:
    - Has real work run through `vajra claude` since the last ground-truth? (The cost ledger is the proof, not test counts.)
    - If not, any "is Vajra-on-Claude satisfying?" verdict is unmeasured by definition — flag it, do not guess.
  dogfood_staleness_questions:
    - Run `vajra next --dogfood-age`. Record the live output (session number, git-derived date, sessions-since, calendar-days-since).
    - Does the live query agree with STATE.md's dogfood entry? If not, STATE.md has drifted — correct it.
    - Is the staleness level acceptable given the product direction? (Red = needs a real paid run soon.)
  pipeline_advance_questions:
    - For each session since the last ground-truth, run `vajra next --stations NN` and read the K-of-8. Is the pipeline advancing (stations demonstrably passed), or is the machinery growing while the payload stalls? (The counter is the proof, not test counts.)
    - Any station ABSENT across many recent sessions is a systemic gap, not per-session noise — name it. A count that never reaches 8/8 in this repo (SHIP needs a synced origin; Reviewer needs an attested ACCEPT) is expected — read the SHAPE, not just the number.
  vision_questions:
    - Is the north-star still the right destination?
    - Is current work the shortest path to it, or intellectually-fun scope creep?
    - What new evidence would make us pivot or abandon this direction?
  roadmap_questions:
    - Does each phase still map to the north-star?
    - Is the next item the highest-leverage one, or just the easiest?
    - Any item now obsolete, or any the vision now demands but the roadmap lacks?
  constitution_questions:
    - Is any rule now blocking the vision instead of protecting it?
    - Did this audit's own mechanism have a blind spot? (meta-check)

load_order:
  - .ai/AGENTS.md
  - .ai/SESSION
  - .ai/SESSION-BOOT.md
  - .ai/TASK.md
  - .ai/STATE.md
  - .ai/CONSTRAINTS.yaml
  - .ai/KNOWLEDGE.md
  - .ai/ROADMAP.md
  - "prompts/{NN}-task-{slug}.md"

budget:
  cap_usd: 5.00
  mode: warn

copilot:
  # ⚡on(work) ⚡include "context" — the co-pilot loader (S21). Fired by scripts/hook-copilot-loader.sh.
  # The agent speaks these as Varta ⚡on(...) from THIS live source; nothing is hand-copied (no drift).
  # Rule form:  "PATTERN => file, file | why this context, for this work"
  #   PATTERN = a path glob, matched against the touched file (repo-relative),
  #          or cmd:<substring>, matched against a Bash command.
  # Maturity-gated: L1 advises (non-blocking), L2/L3 enforce (exit 2 — block until surfaced).
  # Per-session debounce: each rule fires once per session, not on every edit.
  on:
    - "src/engine/* => docs/adr/0003-settings-injector-and-compression-heuristics.md, .ai/KNOWLEDGE.md | heuristics share the LINE_CAP / passthrough trim contract — load it before editing"
    - "*.varta => varta/SKILL.md | Varta is spoken from the live .ai/, never hand-copied — re-read the rule before editing a .varta"
    - "cmd:git commit => .ai/STATE.md | STATE.md is a snapshot of reality — confirm it matches before you commit"

enforcement:
  binds_all_agents: true
  fail_closed: true
  # S47 founder directive: the publish-guard is OFF in THIS repo (enforcement arc complete +
  # live-verified S46; direction B). Publishing (git push / gh pr create|merge) is allowed with
  # no env var. Re-arm the block with VAJRA_ENFORCE_PUBLISH=1, or delete this line. The `vajra
  # init` scaffold does NOT carry this line, so new projects keep the guard on.
  publish_guard: off
  closeout_not_done_until: scripts/verify-closeout.sh exits 0

trust:
  forbidden_phrases: []
