[package]
name = "vajractl"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "One CLI that guides any AI coding agent through your project, step by step"
license = "Apache-2.0"
repository = "https://github.com/ifelse-codes/vajra"
homepage = "https://github.com/ifelse-codes/vajra"
readme = "README.md"
keywords = ["ai", "agent", "workflow", "cli", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
  ".ai/",
  ".claude/",
  ".githooks/",
  "!.githooks/pre-commit",
  "!.githooks/pre-push",
  "docs/",
  "e2e-proof/",
  "Formula/",
  "prompts/",
  "research/",
  "scripts/*",
  "!scripts/hook-copilot-loader.sh",
  "!scripts/hook-copilot-murmur.sh",
  "!scripts/hook-publish-guard.sh",
  "!scripts/hook-commit-guard.sh",
  "!scripts/hook-session-guard.sh",
  "!scripts/hook-session-start.sh",
  "!scripts/verify-closeout.sh",
  "!scripts/demo-session-template.sh",
  "sessions/",
  "source-material/",
  "VAJRA-MASTER.md",
  "VISION.md",
  "DESIGN-BRIEF.html",
  "first-mate.html",
  "vajra-cto-audit-2026-07-22.html",
  "next prompt .md",
]

[[bin]]
name = "vajra"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"